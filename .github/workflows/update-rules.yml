name: Update deduplicated ad rules

on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main, zing/feature/deduplicated-ad-subscription]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ad-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download pinned Mihomo compiler
        run: python3 scripts/install_mihomo.py
      - name: Read previous published statistics
        run: python3 scripts/download_previous.py
      - name: Fetch, deduplicate, verify, and compile
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -f previous/stats.json ]]; then
            args+=(--previous-stats previous/stats.json)
          fi
          python3 scripts/merge_rules.py --output build/ads.yaml --mihomo "$PWD/bin/mihomo" "${args[@]}"
      - name: Publish complete release
        run: python3 scripts/publish_rules.py
      - name: Publish Shadowrocket download mirror
        shell: bash
        run: |
          set -euo pipefail
          mirror=$(mktemp -d)
          trap 'rm -rf "$mirror"' EXIT
          gh auth setup-git --hostname github.com
          git -C "$mirror" init --quiet --initial-branch=shadowrocket
          git -C "$mirror" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git -C "$mirror" ls-remote --exit-code --heads origin refs/heads/shadowrocket; then
            git -C "$mirror" fetch --depth=1 origin refs/heads/shadowrocket
            git -C "$mirror" reset --hard FETCH_HEAD
          else
            status=$?
            if [[ $status -ne 2 ]]; then exit "$status"; fi
          fi
          cp build/ads.list "$mirror/ads.list"
          sed 's|https://github.com/ZingYao/clash-ad-rules/releases/latest/download/ads.list|https://cdn.jsdelivr.net/gh/ZingYao/clash-ad-rules@shadowrocket/ads.list|' \
            shadowrocket-adblock.conf > "$mirror/shadowrocket-adblock.conf"
          git -C "$mirror" add ads.list shadowrocket-adblock.conf
          if git -C "$mirror" diff --cached --quiet; then exit 0; fi
          git -C "$mirror" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --message 'chore: 更新小火箭规则镜像'
          git -C "$mirror" push origin HEAD:refs/heads/shadowrocket
